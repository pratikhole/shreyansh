<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Website Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #172033;
        }

        .container {
            width: min(1400px, 94%);
            margin: 0 auto;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 22px 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin-top: 5px;
            color: #6b7280;
            font-size: 14px;
        }

        .refresh {
            border: 0;
            padding: 10px 16px;
            border-radius: 8px;
            background: #172033;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh:hover {
            opacity: 0.9;
        }

        main {
            padding: 30px 0 60px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 16px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
        }

        .card-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .card-number {
            font-size: 30px;
            font-weight: 700;
        }

        .section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .section-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .section-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .section-body {
            padding: 20px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        select,
        input {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            background: white;
            font-size: 14px;
        }

        input {
            min-width: 280px;
        }

        .change {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .change:last-child {
            margin-bottom: 0;
        }

        .change-top {
            padding: 15px;
            background: #fafafa;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .url {
            color: #2563eb;
            font-weight: 600;
            word-break: break-all;
        }

        .priority {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .high {
            background: #fee2e2;
            color: #991b1b;
        }

        .medium {
            background: #fef3c7;
            color: #92400e;
        }

        .low {
            background: #e5e7eb;
            color: #374151;
        }

        .change-body {
            padding: 15px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-name {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .old,
        .new,
        .added,
        .removed {
            padding: 12px;
            border-radius: 8px;
            margin-top: 7px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .old {
            background: #fff1f2;
            border-left: 4px solid #ef4444;
        }

        .new {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
        }

        .added {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
        }

        .removed {
            background: #fff1f2;
            border-left: 4px solid #ef4444;
        }

        .label-old {
            color: #b91c1c;
            font-weight: 700;
        }

        .label-new {
            color: #15803d;
            font-weight: 700;
        }

        .label-added {
            color: #15803d;
            font-weight: 700;
        }

        .label-removed {
            color: #b91c1c;
            font-weight: 700;
        }

        .empty {
            text-align: center;
            padding: 35px 10px;
            color: #6b7280;
        }

        .run-table {
            width: 100%;
            border-collapse: collapse;
        }

        .run-table th,
        .run-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 13px;
        }

        .status {
            font-weight: 700;
        }

        .status-success {
            color: #15803d;
        }

        .status-invalid {
            color: #b91c1c;
        }

        .status-running {
            color: #92400e;
        }

        .failure {
            border: 1px solid #fecaca;
            background: #fff7f7;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .failure-url {
            font-weight: 700;
            word-break: break-all;
        }

        .failure-message {
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
        }

        .loading {
            padding: 30px;
            text-align: center;
            color: #6b7280;
        }

        .last-updated {
            color: #6b7280;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 1000px) {
            .cards {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            .cards {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            header .container {
                align-items: flex-start;
                flex-direction: column;
            }

            input {
                min-width: 100%;
            }

            .run-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container">

        <div>
            <h1>ExcelR Website Monitor</h1>

            <div class="subtitle">
                Level-2 website change monitoring
            </div>

            <div
                class="last-updated"
                id="lastUpdated"
            >
                Loading...
            </div>
        </div>

        <button
            class="refresh"
            onclick="loadDashboard()"
        >
            Refresh
        </button>

    </div>
</header>


<main>
<div class="container">

    <!-- SUMMARY -->

    <div class="cards">

        <div class="card">
            <div class="card-label">
                Total Pages
            </div>

            <div
                class="card-number"
                id="totalPages"
            >
                -
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                New Pages
            </div>

            <div
                class="card-number"
                id="newPages"
            >
                -
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                Changed Pages
            </div>

            <div
                class="card-number"
                id="changedPages"
            >
                -
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                Removed Pages
            </div>

            <div
                class="card-number"
                id="removedPages"
            >
                -
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                Failed Pages
            </div>

            <div
                class="card-number"
                id="failedPages"
            >
                -
            </div>
        </div>

    </div>


    <!-- CHANGES -->

    <div class="section">

        <div class="section-header">
            <h2>
                Detected Changes
            </h2>
        </div>

        <div class="section-body">

            <div class="filters">

                <select id="priorityFilter">
                    <option value="ALL">
                        All priorities
                    </option>

                    <option value="HIGH">
                        High
                    </option>

                    <option value="MEDIUM">
                        Medium
                    </option>

                    <option value="LOW">
                        Low
                    </option>
                </select>


                <select id="fieldFilter">

                    <option value="ALL">
                        All change types
                    </option>

                    <option value="title">
                        Title
                    </option>

                    <option value="meta_description">
                        Meta Description
                    </option>

                    <option value="canonical">
                        Canonical
                    </option>

                    <option value="h1">
                        H1
                    </option>

                    <option value="robots">
                        Robots
                    </option>

                    <option value="content">
                        Content
                    </option>

                    <option value="images">
                        Images
                    </option>

                    <option value="internal_links">
                        Internal Links
                    </option>

                    <option value="schema">
                        Schema
                    </option>

                    <option value="new_page">
                        New Page
                    </option>

                    <option value="page_removed">
                        Removed Page
                    </option>

                </select>


                <input
                    id="searchFilter"
                    type="search"
                    placeholder="Search URL..."
                >

            </div>


            <div
                id="changes"
                class="loading"
            >
                Loading changes...
            </div>

        </div>

    </div>


    <!-- FAILED PAGES -->

    <div class="section">

        <div class="section-header">
            <h2>
                Failed Pages
            </h2>
        </div>

        <div class="section-body">

            <div
                id="failures"
                class="loading"
            >
                Loading failures...
            </div>

        </div>

    </div>


    <!-- RUN HISTORY -->

    <div class="section">

        <div class="section-header">
            <h2>
                Crawl History
            </h2>
        </div>

        <div class="section-body">

            <div
                id="runs"
                class="loading"
            >
                Loading crawl history...
            </div>

        </div>

    </div>

</div>
</main>


<script>

let dashboardData = {
    changes: [],
    failures: [],
    runs: [],
    total_pages: 0
};


/* ============================================================
   LOAD DATA
============================================================ */

async function loadDashboard() {

    const changesBox =
        document.getElementById("changes");

    try {

        changesBox.innerHTML =
            "Loading changes...";

        /*
         * Cache-busting query prevents the browser
         * from displaying an old GitHub Pages copy.
         */

        const response = await fetch(
            "data.json?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "Could not load data.json"
            );
        }

        dashboardData =
            await response.json();

        renderSummary();

        renderChanges();

        renderFailures();

        renderRuns();

        document.getElementById(
            "lastUpdated"
        ).textContent =
            "Dashboard data loaded: "
            + new Date().toLocaleString();

    }

    catch (error) {

        console.error(error);

        changesBox.innerHTML = `
            <div class="empty">
                Could not load monitoring data.
                <br><br>
                Make sure the GitHub Actions workflow
                has completed at least once.
            </div>
        `;
    }
}


/* ============================================================
   SUMMARY
============================================================ */

function renderSummary() {

    const changes =
        dashboardData.changes || [];

    const failures =
        dashboardData.failures || [];

    const currentRun =
        dashboardData.runs &&
        dashboardData.runs.length
            ? dashboardData.runs[0]
            : null;


    document.getElementById(
        "totalPages"
    ).textContent =
        dashboardData.total_pages || 0;


    if (currentRun) {

        document.getElementById(
            "newPages"
        ).textContent =
            currentRun.new_pages || 0;

        document.getElementById(
            "changedPages"
        ).textContent =
            currentRun.changed_pages || 0;

        document.getElementById(
            "removedPages"
        ).textContent =
            currentRun.removed_pages || 0;

        document.getElementById(
            "failedPages"
        ).textContent =
            currentRun.failed_pages || 0;

    } else {

        document.getElementById(
            "newPages"
        ).textContent = 0;

        document.getElementById(
            "changedPages"
        ).textContent = 0;

        document.getElementById(
            "removedPages"
        ).textContent = 0;

        document.getElementById(
            "failedPages"
        ).textContent =
            failures.length;
    }
}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ============================================================
   FORMAT VALUE
============================================================ */

function formatValue(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    if (typeof value === "object") {

        return JSON.stringify(
            value,
            null,
            2
        );
    }

    return String(value);
}


/* ============================================================
   CHANGE FIELD RENDERER
============================================================ */

function renderField(
    field,
    value
) {

    const fieldNames = {
        title: "Title",
        meta_description: "Meta Description",
        canonical: "Canonical",
        h1: "H1",
        robots: "Robots",
        content: "Content",
        images: "Images",
        internal_links: "Internal Links",
        schema: "Schema",
        final_url: "Final URL",
        status: "HTTP Status",
        new_page: "New Page",
        page_removed: "Removed Page"
    };

    const title =
        fieldNames[field] || field;


    /* --------------------------------------------------------
       NEW PAGE
    -------------------------------------------------------- */

    if (field === "new_page") {

        return `
            <div class="field">
                <div class="field-name">
                    NEW PAGE
                </div>

                <div class="new">
                    New page detected.
                </div>
            </div>
        `;
    }


    /* --------------------------------------------------------
       REMOVED PAGE
    -------------------------------------------------------- */

    if (field === "page_removed") {

        return `
            <div class="field">
                <div class="field-name">
                    REMOVED PAGE
                </div>

                <div class="removed">
                    Page is no longer available
                    in the successful crawl.
                </div>
            </div>
        `;
    }


    /* --------------------------------------------------------
       CONTENT DIFF
    -------------------------------------------------------- */

    if (field === "content") {

        const added =
            value.added || [];

        const removed =
            value.removed || [];

        return `
            <div class="field">

                <div class="field-name">
                    CONTENT
                </div>

                ${
                    added.length
                    ? `
                        <div>
                            <span class="label-added">
                                ADDED
                            </span>

                            <div class="added">
                                ${escapeHtml(
                                    added
                                    .map(x => "+ " + x)
                                    .join("\n")
                                )}
                            </div>
                        </div>
                    `
                    : ""
                }

                ${
                    removed.length
                    ? `
                        <div style="margin-top:12px">
                            <span class="label-removed">
                                REMOVED
                            </span>

                            <div class="removed">
                                ${escapeHtml(
                                    removed
                                    .map(x => "- " + x)
                                    .join("\n")
                                )}
                            </div>
                        </div>
                    `
                    : ""
                }

            </div>
        `;
    }


    /* --------------------------------------------------------
       IMAGES
    -------------------------------------------------------- */

    if (field === "images") {

        const added =
            value.added || [];

        const removed =
            value.removed || [];

        const altChanged =
            value.alt_changed || [];

        return `
            <div class="field">

                <div class="field-name">
                    IMAGES
                </div>

                ${
                    added.length
                    ? `
                        <div class="added">
                            <span class="label-added">
                                ADDED
                            </span>

                            ${escapeHtml(
                                added.join("\n")
                            )}
                        </div>
                    `
                    : ""
                }

                ${
                    removed.length
                    ? `
                        <div class="removed">
                            <span class="label-removed">
                                REMOVED
                            </span>

                            ${escapeHtml(
                                removed.join("\n")
                            )}
                        </div>
                    `
                    : ""
                }

                ${
                    altChanged.length
                    ? `
                        <div class="new">
                            <span class="label-new">
                                ALT TEXT CHANGED
                            </span>

                            ${escapeHtml(
                                JSON.stringify(
                                    altChanged,
                                    null,
                                    2
                                )
                            )}
                        </div>
                    `
                    : ""
                }

            </div>
        `;
    }


    /* --------------------------------------------------------
       INTERNAL LINKS
    -------------------------------------------------------- */

    if (
        field === "internal_links"
    ) {

        const added =
            value.added || [];

        const removed =
            value.removed || [];

        return `
            <div class="field">

                <div class="field-name">
                    INTERNAL LINKS
                </div>

                ${
                    added.length
                    ? `
                        <div class="added">
                            <span class="label-added">
                                ADDED
                            </span>

                            ${escapeHtml(
                                added.join("\n")
                            )}
                        </div>
                    `
                    : ""
                }

                ${
                    removed.length
                    ? `
                        <div class="removed">
                            <span class="label-removed">
                                REMOVED
                            </span>

                            ${escapeHtml(
                                removed.join("\n")
                            )}
                        </div>
                    `
                    : ""
                }

            </div>
        `;
    }


    /* --------------------------------------------------------
       SCHEMA
    -------------------------------------------------------- */

    if (field === "schema") {

        return `
            <div class="field">

                <div class="field-name">
                    SCHEMA
                </div>

                <div class="old">

                    <span class="label-old">
                        OLD
                    </span>

                    ${escapeHtml(
                        formatValue(
                            value.old
                        )
                    )}

                </div>

                <div class="new">

                    <span class="label-new">
                        NEW
                    </span>

                    ${escapeHtml(
                        formatValue(
                            value.new
                        )
                    )}

                </div>

            </div>
        `;
    }


    /* --------------------------------------------------------
       NORMAL OLD / NEW FIELD
    -------------------------------------------------------- */

    return `
        <div class="field">

            <div class="field-name">
                ${escapeHtml(title)}
            </div>

            <div class="old">

                <span class="label-old">
                    OLD
                </span>

                ${escapeHtml(
                    formatValue(
                        value.old
                    )
                )}

            </div>

            <div class="new">

                <span class="label-new">
                    NEW
                </span>

                ${escapeHtml(
                    formatValue(
                        value.new
                    )
                )}

            </div>

        </div>
    `;
}


/* ============================================================
   RENDER CHANGES
============================================================ */

function renderChanges() {

    const container =
        document.getElementById(
            "changes"
        );

    let changes =
        dashboardData.changes || [];


    const priority =
        document.getElementById(
            "priorityFilter"
        ).value;


    const field =
        document.getElementById(
            "fieldFilter"
        ).value;


    const search =
        document.getElementById(
            "searchFilter"
        ).value
        .toLowerCase()
        .trim();


    changes =
        changes.filter(change => {

            if (
                priority !== "ALL" &&
                change.priority !== priority
            ) {
                return false;
            }

            if (search) {

                if (
                    !String(
                        change.url || ""
                    )
                    .toLowerCase()
                    .includes(search)
                ) {
                    return false;
                }
            }

            if (
                field !== "ALL"
            ) {

                let fields = {};

                try {

                    fields =
                        typeof change.changed_fields
                        === "string"

                        ? JSON.parse(
                            change.changed_fields
                        )

                        : (
                            change.changed_fields
                            || {}
                        );

                } catch {
                    return false;
                }

                if (
                    !Object.prototype
                        .hasOwnProperty
                        .call(
                            fields,
                            field
                        )
                ) {
                    return false;
                }
            }

            return true;
        });


    if (!changes.length) {

        container.innerHTML = `
            <div class="empty">
                No matching changes found.
            </div>
        `;

        return;
    }


    container.innerHTML =
        changes
        .map(change => {

            let fields = {};

            try {

                fields =
                    typeof change.changed_fields
                    === "string"

                    ? JSON.parse(
                        change.changed_fields
                    )

                    : (
                        change.changed_fields
                        || {}
                    );

            } catch {
                fields = {};
            }


            const priorityClass =
                String(
                    change.priority ||
                    "LOW"
                ).toLowerCase();


            return `
                <div class="change">

                    <div class="change-top">

                        <a
                            class="url"
                            href="${escapeHtml(
                                change.url
                            )}"
                            target="_blank"
                            rel="noopener"
                        >
                            ${escapeHtml(
                                change.url
                            )}
                        </a>

                        <span
                            class="priority
                            ${priorityClass}"
                        >
                            ${escapeHtml(
                                change.priority
                            )}
                        </span>

                    </div>

                    <div class="change-body">

                        ${Object.entries(fields)
                            .map(
                                ([key, value]) =>
                                    renderField(
                                        key,
                                        value
                                    )
                            )
                            .join("")
                        }

                    </div>

                </div>
            `;

        })
        .join("");
}


/* ============================================================
   RENDER FAILURES
============================================================ */

function renderFailures() {

    const container =
        document.getElementById(
            "failures"
        );

    const failures =
        dashboardData.failures || [];


    if (!failures.length) {

        container.innerHTML = `
            <div class="empty">
                No recent failures.
            </div>
        `;

        return;
    }


    container.innerHTML =
        failures
        .map(failure => {

            return `
                <div class="failure">

                    <div class="failure-url">
                        ${escapeHtml(
                            failure.url
                        )}
                    </div>

                    <div class="failure-message">

                        Status:
                        ${escapeHtml(
                            failure.status ??
                            "N/A"
                        )}

                        &nbsp; | &nbsp;

                        Type:
                        ${escapeHtml(
                            failure.error_type
                        )}

                        <br>

                        ${escapeHtml(
                            failure.message ||
                            ""
                        )}

                        <br>

                        Retries:
                        ${escapeHtml(
                            failure.retries ||
                            0
                        )}

                    </div>

                </div>
            `;

        })
        .join("");
}


/* ============================================================
   RENDER RUN HISTORY
============================================================ */

function renderRuns() {

    const container =
        document.getElementById(
            "runs"
        );

    const runs =
        dashboardData.runs || [];


    if (!runs.length) {

        container.innerHTML = `
            <div class="empty">
                No crawl history available.
            </div>
        `;

        return;
    }


    container.innerHTML = `

        <table class="run-table">

            <thead>

                <tr>
                    <th>Run</th>
                    <th>Started</th>
                    <th>Discovered</th>
                    <th>Successful</th>
                    <th>New</th>
                    <th>Changed</th>
                    <th>Removed</th>
                    <th>Failed</th>
                    <th>Duration</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody>

                ${runs.map(run => {

                    const status =
                        String(
                            run.status ||
                            ""
                        ).toLowerCase();


                    return `
                        <tr>

                            <td>
                                #${escapeHtml(
                                    run.id
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    run.started_at
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    run.discovered ||
                                    0
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    run.successful ||
                                    0
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    run.new_pages ||
                                    0
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    run.changed_pages ||
                                    0
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    run.removed_pages ||
                                    0
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    run.failed_pages ||
                                    0
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    Number(
                                        run.duration_seconds ||
                                        0
                                    ).toFixed(1)
                                )}s
                            </td>

                            <td>

                                <span
                                    class="
                                        status
                                        status-${status}
                                    "
                                >
                                    ${escapeHtml(
                                        run.status
                                    )}
                                </span>

                            </td>

                        </tr>
                    `;

                }).join("")}

            </tbody>

        </table>
    `;
}

    )

    );


document
    .getElementById(

    )
    .addEventListener(

    );

loadDashboard();

</script>
